packages:
  - 'apps/*'
  - 'packages/*'
  - 'packages/*/*'
  - 'tests/*'
  - 'tools/*'

autoInstallPeers: true
onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@swc/core'
  - esbuild
  - nx
  - sharp

ignoredBuiltDependencies:
  - less

# Vá lỗ hổng gói con của NestJS/Express (ISS-OPS-004): chỉ thay các bản có advisory.
overrides:
  'multer@<2.5.0': ^2.5.0
  'body-parser@>=2 <2.4.0': ^2.4.0
  'body-parser@<1.20.9': ^1.20.9
  'proxy-addr@<2.0.8': ^2.0.8
  # Nx 23.1.3 ghim cứng các gói con có lỗ hổng (ISS-OPS-018); chỉ thay trong cây của nx.
  'nx>axios': ^1.20.0
  'nx>brace-expansion': ^5.0.11
  'nx>follow-redirects': ^1.16.2
  'nx>smol-toml': ^1.7.1
