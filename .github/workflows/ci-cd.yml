name: CI and production deployment

on:
  pull_request:
    branches: [main, dev/release]
  push:
    branches: [main, dev/release]
  workflow_dispatch:

concurrency:
  group: enterprise-platform-${{ github.workflow }}-${{ github.ref }}
  # A newer push to a PR supersedes the older run. Runs on main and dev/release
  # are never cancelled so every publish completes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '24.11.0'
  PNPM_VERSION: '10.33.1'
  # The affected graph can include most of the workspace. Run a small number of
  # tasks at once and give each Node process a bounded heap so ESLint is not
  # terminated by the hosted runner running out of memory.
  NX_PARALLEL: '2'
  NODE_OPTIONS: '--max-old-space-size=3072'

jobs:
  detect-changes:
    name: Detect CI scope
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      image_inputs: ${{ steps.filter.outputs.image_inputs }}
    steps:
      - uses: actions/checkout@v4

      # Chức năng chọn tài khoản nhanh ở form đăng nhập kèm mật khẩu, chỉ dùng cục bộ; không được lên repo.
      - name: Block dev login presets
        run: node tools/check-no-dev-login-presets.mjs

      # Migration đã merge thì không sửa, xoá, đổi tên; file mới phải đăng ký. Chạy cả với PR chỉ có file .sql.
      - name: Block edits to merged migrations
        if: github.event_name == 'pull_request'
        env:
          MIGRATIONS_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$MIGRATIONS_BASE"
          node tools/check-migrations.mjs

      # .claude/skills là bản sao của .agents/skills cho Claude Code, sinh bằng tools/sync-agent-skills.mjs.
      - name: Check agent skills mirror
        run: node tools/sync-agent-skills.mjs --check

      - name: Classify changed files
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            image_inputs:
              - 'apps/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'nx.json'
              - 'tsconfig*.json'
              - 'tools/deployment/services.json'
              - 'tools/deployment/ci-matrix.mjs'
              - 'tools/deployment/publish-plan.mjs'
              - 'infrastructure/docker/**'
              - 'infrastructure/nginx/**'

  validate:
    name: Validate affected projects
    needs: detect-changes
    if: needs.detect-changes.outputs.image_inputs == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      notification-postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: notification_test
          POSTGRES_PASSWORD: notification_test
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U notification_test -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      notification-valkey:
        image: valkey/valkey:9.1.2-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
      notification-rabbitmq:
        image: rabbitmq:4-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: notification_test
          RABBITMQ_DEFAULT_PASS: notification_test
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - name: Checkout full history for Nx affected
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Nx workspace synchronization
        run: pnpm nx sync:check

      # Không thẻ <select> gốc, không emoji (AGENTS.md). Quét mọi project, kể cả project chưa có cấu hình ESLint.
      - name: Check UI rules
        run: node tools/check-ui-rules.mjs

      - name: Restore Nx task cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Select Nx comparison range
        id: nx-range
        shell: bash
        run: |
          if [[ '${{ github.event_name }}' == 'pull_request' ]]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          elif [[ '${{ github.event.before }}' != '0000000000000000000000000000000000000000' ]]; then
            echo "base=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          else
            echo 'base=' >> "$GITHUB_OUTPUT"
          fi

      # The build of an app is not repeated here: the Docker image of every app
      # runs that same build (verify-containers on pull requests, publish on
      # push). Library builds still run, as dependencies of tests and directly.
      - name: Lint, type-check, test, and build affected projects
        shell: bash
        run: |
          apps=$(node -p "require('./tools/deployment/services.json').services.filter((s) => s.dockerfile.startsWith('apps/')).map((s) => s.id).join(',')")
          if [[ -n '${{ steps.nx-range.outputs.base }}' ]]; then
            pnpm nx affected -t lint typecheck test --base='${{ steps.nx-range.outputs.base }}' --head=HEAD --parallel="$NX_PARALLEL" --nxBail
            pnpm nx affected -t build --exclude="$apps" --base='${{ steps.nx-range.outputs.base }}' --head=HEAD --parallel="$NX_PARALLEL" --nxBail
          else
            pnpm nx run-many -t lint typecheck test --parallel="$NX_PARALLEL" --nxBail
            pnpm nx run-many -t build --exclude="$apps" --parallel="$NX_PARALLEL" --nxBail
          fi

      - name: Verify notification database, broker, and recovery integrations without cache
        env:
          NOTIFICATIONS_TEST_ADMIN_URL: postgresql://notification_test:notification_test@localhost:5432/postgres
          HRM_TEST_ADMIN_URL: postgresql://notification_test:notification_test@localhost:5432/postgres
          FINANCE_TEST_ADMIN_URL: postgresql://notification_test:notification_test@localhost:5432/postgres
          SHARED_TEST_ADMIN_URL: postgresql://notification_test:notification_test@localhost:5432/postgres
          RABBITMQ_TEST_URL: amqp://notification_test:notification_test@localhost:5672
          REALTIME_TEST_REDIS_URL: redis://localhost:6379
        run: pnpm nx run-many -t test -p contracts-realtime module-notifications adapter-events realtime-api notification-worker platform-entitlement module-hrm module-finance module-shared --runInBand --detectOpenHandles --skipNxCache --parallel=1

  prepare-services:
    name: Create deployment matrix
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Read the image tags in GHCR to decide which services need a new build.
      packages: read
    outputs:
      # Every service.
      matrix: ${{ steps.matrix.outputs.matrix }}
      # Pull requests only build the services whose Nx project is affected.
      verify_matrix: ${{ steps.verify-matrix.outputs.matrix }}
      # Pushes build the services that changed since their production image...
      publish_matrix: ${{ steps.publish-plan.outputs.publish_matrix }}
      # ...and only re-tag the production image of the others.
      retag: ${{ steps.publish-plan.outputs.retag }}
      retag_count: ${{ steps.publish-plan.outputs.retag_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so Nx can diff against the PR base commit.
          fetch-depth: 0

      - name: Validate deployment manifest and create matrix
        id: matrix
        run: echo "matrix=$(node tools/deployment/ci-matrix.mjs)" >> "$GITHUB_OUTPUT"

      - name: Test publish planner
        run: node --test tools/deployment/publish-plan.spec.mjs

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Select services to verify
        id: verify-matrix
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ '${{ github.event_name }}' == 'pull_request' ]]; then
            affected=$(pnpm exec nx show projects --affected --base="$BASE_SHA" --head=HEAD --json)
            echo "Affected projects: $affected"
            matrix=$(AFFECTED_PROJECTS="$affected" node tools/deployment/ci-matrix.mjs)
          else
            matrix=$(node tools/deployment/ci-matrix.mjs)
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

      # Services whose code is unchanged since their production image keep that
      # image: it only gets a new <service>-sha-<commit> tag so a rollback to
      # any commit still finds every service. Falls back to building all.
      - name: Plan image publishing
        id: publish-plan
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GHCR_OWNER: ${{ github.repository_owner }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          plan=$(node tools/deployment/publish-plan.mjs)
          echo "Plan: $plan"
          {
            echo "publish_matrix=$(INCLUDE_SERVICES="$(jq -c .build <<<"$plan")" node tools/deployment/ci-matrix.mjs)"
            echo "retag=$(jq -c .retag <<<"$plan")"
            echo "retag_count=$(jq '.retag | length' <<<"$plan")"
          } >> "$GITHUB_OUTPUT"

  validate-deployment:
    name: Validate deployment configuration
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Validate production and local Compose files
        shell: bash
        env:
          PLATFORM_DB_PASSWORD: validation-password
          TENANT_DB_PASSWORD: validation-password
          RABBITMQ_PASSWORD: validation-password
          VALKEY_PASSWORD: validation-password
          REALTIME_ALLOWED_ORIGINS: https://erp.validation.local
          REALTIME_DELIVERY_ENABLED: 'true'
          REALTIME_MUTATIONS_ENABLED: 'true'
          NOTIFICATION_CONSUMER_ENABLED: 'true'
          MINIO_ROOT_USER: validation-user
          MINIO_ROOT_PASSWORD: validation-password
          SEED_SUPERADMIN_PASSWORD: validation-password
          INTERNAL_SERVICE_TOKEN: validation-token
          AUTH_PRIVATE_KEY: validation-private-key
          AUTH_PUBLIC_KEY: validation-public-key
          S3_PUBLIC_ENDPOINT: https://minio-erp.validation.local
          IMAGE_TAG: production
        run: |
          docker compose -f infrastructure/docker/compose.local.yml config --quiet
          docker compose -f infrastructure/docker/compose.coolify.yml config --quiet
          docker compose -f infrastructure/docker/compose.full.yml config --quiet

  publish:
    name: Build and publish ${{ matrix.service }}
    needs: [detect-changes, validate, prepare-services, validate-deployment]
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      (github.ref_name == 'main' || github.ref_name == 'dev/release') &&
      needs.detect-changes.outputs.image_inputs == 'true' &&
      needs.validate.result == 'success' &&
      needs.prepare-services.result == 'success' &&
      needs.validate-deployment.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-services.outputs.publish_matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/svn-investment-technology-jsc/${{ matrix.imageRepository }}:${{ matrix.service }}-sha-${{ github.sha }}
            ghcr.io/svn-investment-technology-jsc/${{ matrix.imageRepository }}:${{ matrix.service }}-production
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  retag-unchanged:
    name: Tag unchanged service images
    needs: [detect-changes, validate, prepare-services, validate-deployment]
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      (github.ref_name == 'main' || github.ref_name == 'dev/release') &&
      needs.detect-changes.outputs.image_inputs == 'true' &&
      needs.validate.result == 'success' &&
      needs.prepare-services.result == 'success' &&
      needs.validate-deployment.result == 'success' &&
      needs.prepare-services.outputs.retag_count != '0'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_REPOSITORY: ghcr.io/svn-investment-technology-jsc/enterprise-platform
      RETAG: ${{ needs.prepare-services.outputs.retag }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Points the new sha tag at the exact digest the plan resolved, not at the
      # mutable -production tag, so a concurrent publish cannot be tagged by mistake.
      - name: Add the commit tag to each unchanged image
        shell: bash
        run: |
          jq -c '.[]' <<<"$RETAG" | while read -r item; do
            service=$(jq -r .service <<<"$item")
            digest=$(jq -r .digest <<<"$item")
            echo "$service: ${digest}"
            docker buildx imagetools create \
              --tag "$IMAGE_REPOSITORY:${service}-sha-${{ github.sha }}" \
              "$IMAGE_REPOSITORY@${digest}"
          done

  # Image builds do not depend on lint, type-check or test results, so they run
  # alongside validate. pr-validation-complete still requires both to succeed.
  verify-containers:
    name: Verify container ${{ matrix.service }}
    needs: [detect-changes, prepare-services]
    if: >-
      github.event_name == 'pull_request' &&
      needs.detect-changes.outputs.image_inputs == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-services.outputs.verify_matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: enterprise-platform-ci/${{ matrix.service }}:verify
          platforms: linux/amd64
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Verify declared Node runtime dependencies
        if: matrix.runtimeCheck != null
        env:
          IMAGE: enterprise-platform-ci/${{ matrix.service }}:verify
          RUNTIME_CHECK: ${{ toJSON(matrix.runtimeCheck) }}
        run: |
          docker run --rm --entrypoint node -e RUNTIME_CHECK "$IMAGE" -e '
            for (const moduleSpecifier of JSON.parse(process.env.RUNTIME_CHECK).nodeModules) {
              require.resolve(moduleSpecifier);
            }
          '

  pr-validation-complete:
    name: PR validation complete
    needs:
      [
        detect-changes,
        validate,
        prepare-services,
        validate-deployment,
        verify-containers,
      ]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Require every PR validation job to succeed
        shell: bash
        run: |
          test '${{ needs.detect-changes.result }}' = 'success'
          test '${{ needs.prepare-services.result }}' = 'success'
          test '${{ needs.validate-deployment.result }}' = 'success'
          if [[ '${{ needs.detect-changes.outputs.image_inputs }}' == 'true' ]]; then
            test '${{ needs.validate.result }}' = 'success'
            test '${{ needs.verify-containers.result }}' = 'success'
          else
            test '${{ needs.validate.result }}' = 'skipped'
            test '${{ needs.verify-containers.result }}' = 'skipped'
          fi

  # Enable this job when GitHub Actions should trigger Coolify automatically.
  # deploy-production:
