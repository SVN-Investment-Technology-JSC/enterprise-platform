  #   needs: publish
  #   env:
  #     COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_PRODUCTION_WEBHOOK }}
  #     COOLIFY_TOKEN: ${{ secrets.COOLIFY_PRODUCTION_TOKEN }}
