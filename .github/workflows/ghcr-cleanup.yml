name: Clean up old GHCR image versions

on:
  schedule:
    - cron: '30 2 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview deletions without changing GHCR
        required: true
        default: true
        type: boolean
      retain_per_service:
        description: Number of SHA releases to retain for every service
        required: true
        default: '10'
        type: string

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      GHCR_OWNER: ${{ github.repository_owner }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
      RETAIN_PER_SERVICE: ${{ github.event_name == 'workflow_dispatch' && inputs.retain_per_service || '10' }}
    steps:
      - uses: actions/checkout@v4

      - name: Remove old SHA-tagged image versions
        run: node tools/deployment/cleanup-ghcr.mjs
