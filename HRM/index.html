          Bàn làm việc
        </h1>
        <span class="text-xs text-slate-400 font-normal hidden sm:inline" id="current-subtitle">| Dashboard điều hành nhân sự</span>
      </div>

      <!-- Quick actions -->
      <div class="flex items-center gap-2.5">
        <button onclick="refreshCurrentFrame()" title="Tải lại giao diện hiện tại" class="p-1.5 text-slate-500 hover:text-slate-800 hover:bg-slate-100 rounded-lg transition-colors border border-slate-200">
          <span class="material-symbols-outlined text-[18px]">refresh</span>
        </button>
        <button onclick="openCurrentInNewTab()" title="Mở trong tab mới" class="p-1.5 text-slate-500 hover:text-slate-800 hover:bg-slate-100 rounded-lg transition-colors border border-slate-200">
          <span class="material-symbols-outlined text-[18px]">open_in_new</span>
        </button>
      </div>
    </header>

    <!-- Sub-page Frame Container -->

      <div id="frame-loader" class="absolute inset-0 bg-slate-50/80 flex items-center justify-center z-10 transition-opacity duration-200">

      </div>

      <iframe id="main-frame" class="w-full h-full border-0" src="" onload="hideLoader()"></iframe>
    </main>

        defaultPath: "ch_nh_s_ch_nh_n_s_sub_tab_quy_t_c_ca_i_mu_n_svn_dts/code.html",
        tabs: [
          { name: "Quy tắc ca & Đi muộn", path: "ch_nh_s_ch_nh_n_s_sub_tab_quy_t_c_ca_i_mu_n_svn_dts/code.html" },
          { name: "Quy tắc làm thêm (OT)", path: "ch_nh_s_ch_nh_n_s_sub_tab_quy_t_c_l_m_th_m_gi_ot_svn_dts/code.html" },
          { name: "Quy tắc nghỉ phép", path: "ch_nh_s_ch_nh_n_s_sub_tab_quy_t_c_ngh_ph_p_svn_dts/code.html" },
          { name: "Lịch sử phiên bản (Audit)", path: "ch_nh_s_ch_nh_n_s_sub_tab_l_ch_s_phi_n_b_n_audit_svn_dts/code.html" }
        ]
      },
      devices: {
        title: "Thiết bị & Tích hợp",
        badge: "QUẢN TRỊ & HỆ THỐNG",
        subtitle: "Quản lý kết nối máy chấm công khuôn mặt, vân tay và log đồng bộ",
        defaultPath: "qu_n_l_ca_ch_m_c_ng_sub_tab_log_ch_m_c_ng_th_svn_dts/code.html",
        tabs: [
          { name: "Log máy chấm công", path: "qu_n_l_ca_ch_m_c_ng_sub_tab_log_ch_m_c_ng_th_svn_dts/code.html" }
        ]
      }
    };

    let currentModuleKey = 'dashboard';
    let currentTabPath = '';

    // Khởi tạo Portal khi load trang
    document.addEventListener("DOMContentLoaded", () => {
      navigateModule('dashboard');
    });

    // Chuyển đổi module chính từ Sidebar
    function navigateModule(modKey, specificTabPath = null) {
      const mod = MODULES_REGISTRY[modKey];
      if (!mod) return;

      currentModuleKey = modKey;
      currentTabPath = specificTabPath || mod.defaultPath;

      // Update sidebar active highlight
      document.querySelectorAll('#sidebar-nav .nav-btn').forEach(btn => {
        if (btn.dataset.mod === modKey) {
          btn.className = "nav-btn w-full flex items-center gap-2.5 px-3.5 py-2 text-white bg-white/20 font-semibold rounded-lg border-l-4 border-white transition-colors text-left";
        } else {
          btn.className = "nav-btn w-full flex items-center gap-2.5 px-3.5 py-2 text-white/75 hover:text-white hover:bg-white/10 rounded-lg transition-colors text-left group";
        }
      });

      // Update Top Bar Meta
      document.getElementById('current-title').textContent = mod.title;
      document.getElementById('current-badge').textContent = mod.badge;
      document.getElementById('current-subtitle').textContent = "| " + mod.subtitle;

      // Load content iframe
      loadIframeContent(currentTabPath);
    }

    // Load file HTML vào iframe và hỗ trợ bắt sự kiện click bên trong iframe
    function loadIframeContent(path) {
      showLoader();
      const iframe = document.getElementById('main-frame');
      iframe.src = path;
    }

    // Bắt sự kiện khi iframe hoàn thành load để nhúng bộ lắng nghe click tự động
    function hideLoader() {
      const loader = document.getElementById('frame-loader');
      if (loader) loader.style.display = 'none';

      // Tự động kết nối các nút/tab bên trong iframe nếu người dùng bấm trực tiếp trong màn hình
      try {
        const iframe = document.getElementById('main-frame');
        const doc = iframe.contentDocument || iframe.contentWindow.document;
        if (!doc) return;

        // Ẩn sidebar phụ nếu file con có sidebar riêng để không bị 2 sidebar trùng nhau
        const innerSidebar = doc.querySelector('aside');
        const innerMain = doc.querySelector('.ml-sidebar-width');
        if (innerSidebar) innerSidebar.style.display = 'none';
        if (innerMain) {
          innerMain.classList.remove('ml-sidebar-width');
          innerMain.style.marginLeft = '0px';
        }

        // Lắng nghe khi subtab hoặc link trong iframe chuyển trang để cập nhật tiêu đề trên header index
        doc.querySelectorAll('.border-b a, nav a, .space-x-8 a, .border-b button').forEach(el => {
          el.addEventListener('click', (e) => {
            const href = el.getAttribute('href');
            if (href && href !== '#') {
              // Tìm tab tương ứng trong registry để đồng bộ tiêu đề Header
              for (const [mKey, mod] of Object.entries(MODULES_REGISTRY)) {
                for (const tab of mod.tabs) {
                  if (href.includes(tab.path) || tab.path.includes(href.replace('../', ''))) {
                    currentModuleKey = mKey;
                    currentTabPath = tab.path;
                    document.getElementById('current-title').textContent = mod.title;
                    document.getElementById('current-badge').textContent = mod.badge;
                    document.getElementById('current-subtitle').textContent = "| " + mod.subtitle;
                    document.querySelectorAll('#sidebar-nav .nav-btn').forEach(btn => {
                      if (btn.dataset.mod === mKey) {
                        btn.className = "nav-btn w-full flex items-center gap-2.5 px-3.5 py-2 text-white bg-white/20 font-semibold rounded-lg border-l-4 border-white transition-colors text-left";
                      } else {
                        btn.className = "nav-btn w-full flex items-center gap-2.5 px-3.5 py-2 text-white/75 hover:text-white hover:bg-white/10 rounded-lg transition-colors text-left group";
                      }
                    });
                    break;
                  }
                }
              }
            }
          });
        });
      } catch (e) {
        console.log("Cross-context note: Handled smoothly.", e);
      }
    }

    function showLoader() {
      const loader = document.getElementById('frame-loader');
      if (loader) loader.style.display = 'flex';
    }

    // Tự động nhận diện khi người dùng click bên trong iframe
    function handleInnerScreenClick(label) {
      for (const [mKey, mod] of Object.entries(MODULES_REGISTRY)) {
        for (const tab of mod.tabs) {
          if (label.includes(tab.name.toLowerCase()) || tab.name.toLowerCase().includes(label)) {
            navigateModule(mKey, tab.path);
            return;
          }
        }
      }
    }

    function refreshCurrentFrame() {
      const iframe = document.getElementById('main-frame');
      if (iframe) iframe.contentWindow.location.reload();
    }

    function openCurrentInNewTab() {
      if (currentTabPath) window.open(currentTabPath, '_blank');
    }
  </script>
</body>
</html>
