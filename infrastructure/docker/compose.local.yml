name: enterprise-platform

services:
  platform-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: ${PLATFORM_DB_PASSWORD:-platform}
    ports: ['55432:5432']
    volumes: ['platform-db:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U platform -d platform']
      interval: 5s
      timeout: 3s
      retries: 20

  # Generic PostgreSQL server for tenants created from Platform Admin.
  # Each new tenant receives its own database inside this server.
  tenant-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tenant
      POSTGRES_PASSWORD: ${TENANT_DB_PASSWORD:-tenant}
      POSTGRES_DB: postgres
    ports: ['55436:5432']
    volumes: ['tenant-db:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tenant -d postgres']
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: platform
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-platform}
    ports: ['5672:5672', '15672:15672']
    volumes: ['rabbitmq:/var/lib/rabbitmq']
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 12

  minio:
    # Keep the local image compatible with the existing development volume and
    # the full-stack compose file. Downgrading MinIO cannot read newer metadata.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-platform}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-platform-development-secret}
    ports: ['9010:9000', '9011:9001']
    volumes: ['minio:/data']
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER:-platform}:${MINIO_ROOT_PASSWORD:-platform-development-secret}@minio:9000
    command: ['mb', '--ignore-existing', 'local/enterprise-platform']

  gateway:
    image: nginx:1.29-alpine
    extra_hosts: ['host.docker.internal:host-gateway']
    ports: ['8080:80']
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/procedure-maintenance.html:/usr/share/nginx/html/procedure-maintenance.html:ro
      - ../nginx/maintenance-maintenance.html:/usr/share/nginx/html/maintenance-maintenance.html:ro

volumes:
  platform-db:
  tenant-db:
  rabbitmq:
  minio:
