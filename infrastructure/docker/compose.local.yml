name: enterprise-platform

services:
  platform-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: ${PLATFORM_DB_PASSWORD:-platform}
    ports: ["55432:5432"]
    volumes: ["platform-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 5s
      timeout: 3s
      retries: 20

  dakrosa-db:
    image: postgres:17-alpine
    environment: &tenant-db-env
      POSTGRES_USER: tenant
      POSTGRES_PASSWORD: ${TENANT_DB_PASSWORD:-tenant}
      POSTGRES_DB: dakrosa
    ports: ["55433:5432"]
    volumes: ["dakrosa-db:/var/lib/postgresql/data"]
    healthcheck: &tenant-health
      test: ["CMD-SHELL", "pg_isready -U tenant"]
      interval: 5s
      timeout: 3s
      retries: 20

  anphat-db:
    image: postgres:17-alpine
    environment:
      <<: *tenant-db-env
      POSTGRES_DB: anphat
    ports: ["55434:5432"]
    volumes: ["anphat-db:/var/lib/postgresql/data"]
    healthcheck: *tenant-health

  minhlong-db:
    image: postgres:17-alpine
    environment:
      <<: *tenant-db-env
      POSTGRES_DB: minhlong
    ports: ["55435:5432"]
    volumes: ["minhlong-db:/var/lib/postgresql/data"]
    healthcheck: *tenant-health

  savina-db:
    image: postgres:17-alpine
    environment:
      <<: *tenant-db-env
      POSTGRES_DB: savina
    ports: ["55436:5432"]
    volumes: ["savina-db:/var/lib/postgresql/data"]
    healthcheck: *tenant-health

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: platform
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-platform}
    ports: ["5672:5672", "15672:15672"]
    volumes: ["rabbitmq:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-platform}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-platform-development-secret}
    ports: ["9010:9000", "9011:9001"]
    volumes: ["minio:/data"]

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on: [minio]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-platform} ${MINIO_ROOT_PASSWORD:-platform-development-secret}; do sleep 2; done;
        mc mb --ignore-existing local/enterprise-platform;

  gateway:
    image: nginx:1.29-alpine
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["8080:80"]
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/procedure-maintenance.html:/usr/share/nginx/html/procedure-maintenance.html:ro
      - ../nginx/maintenance-maintenance.html:/usr/share/nginx/html/maintenance-maintenance.html:ro

volumes:
  platform-db:
  dakrosa-db:
  anphat-db:
  minhlong-db:
  savina-db:
  rabbitmq:
  minio:
