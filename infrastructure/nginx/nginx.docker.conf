events { worker_connections 1024; }

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  resolver 127.0.0.11 ipv6=off valid=30s;
  resolver_timeout 5s;

  upstream platform_web {
    zone platform_web 64k;
    server web:3000 resolve;
  }

  upstream procedure_web {
    zone procedure_web 64k;
    server procedure-web:3001 resolve;
  }

  upstream maintenance_web {
    zone maintenance_web 64k;
    server maintenance-web:3004 resolve;
  }

  upstream platform_api {
    zone platform_api 64k;
    server api:3333 resolve;
  }

  upstream procedure_api {
    zone procedure_api 64k;
    server procedure-api:3334 resolve;
  }

  upstream maintenance_api {
    zone maintenance_api 64k;
    server maintenance-api:3335 resolve;
  }

  server {
    listen 80;
    server_name _;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    location ^~ /api/procedure/ {
      proxy_pass http://procedure_api;
      proxy_intercept_errors on;
      error_page 502 503 504 = @procedure_api_maintenance;
    }

    location ^~ /api/maintenance/ {
      proxy_pass http://maintenance_api;
      proxy_intercept_errors on;
      error_page 502 503 504 = @maintenance_api_maintenance;
    }

    location ^~ /api/auth/ { proxy_pass http://platform_api; }
    location ^~ /api/platform/ { proxy_pass http://platform_api; }
    location ^~ /api/crm/ { proxy_pass http://platform_api; }
    location ^~ /api/inventory/ { proxy_pass http://platform_api; }

    location ^~ /modules/procedure/ {
      proxy_pass http://procedure_web;
      proxy_intercept_errors on;
      error_page 502 503 504 = /procedure-maintenance.html;
    }

    location = /modules/procedure {
      proxy_pass http://procedure_web;
      proxy_intercept_errors on;
      error_page 502 503 504 = /procedure-maintenance.html;
    }

    location = /procedure-maintenance.html {
      internal;
      root /usr/share/nginx/html;
    }

    location ^~ /modules/maintenance/ {
      proxy_pass http://maintenance_web;
      proxy_intercept_errors on;
      error_page 502 503 504 = /maintenance-maintenance.html;
    }

    location = /modules/maintenance {
      proxy_pass http://maintenance_web;
      proxy_intercept_errors on;
      error_page 502 503 504 = /maintenance-maintenance.html;
    }

    location = /maintenance-maintenance.html {
      internal;
      root /usr/share/nginx/html;
    }

    location / { proxy_pass http://platform_web; }

    location @procedure_api_maintenance {
      default_type application/json;
      add_header Retry-After 30 always;
      return 503 '{"statusCode":503,"code":"PROCEDURE_MAINTENANCE","message":"Procedure Engine đang bảo trì; CRM và Platform vẫn hoạt động."}';
    }

    location @maintenance_api_maintenance {
      default_type application/json;
      add_header Retry-After 30 always;
      return 503 '{"statusCode":503,"code":"MAINTENANCE_MAINTENANCE","message":"Maintenance đang bảo trì; Procedure, CRM và Platform vẫn hoạt động."}';
    }
  }
}
